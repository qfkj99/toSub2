services:
  tosub2:
    build: .
    image: tosub2:local
    init: true
    restart: unless-stopped
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${TOSUB2_ALLOWED_HOST:-tosub2.tibo.chat}"
    ports:
      - "${TOSUB2_BIND_ADDRESS:-0.0.0.0}:${TOSUB2_PORT:-4399}:4399"
    volumes:
      - tosub2-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 30s

volumes:
  tosub2-data:
